name: Validate OpenAPPA policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate policy
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check policy structure
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          policy = pathlib.Path('appa.toml')
          parsed = tomllib.loads(policy.read_text())
          assert parsed.get('policy', {}).get('version') == 2, 'policy.version must be 2'
          assert isinstance(parsed['policy'].get('tool'), list), 'declare at least one policy.tool'
          PY
      - name: Install OpenAPPA for trajectory tests
        if: hashFiles('traces/*.appa') != ''
        env:
          # A pinned release and the archive's SHA256 from that release's
          # SHA256SUMS. Update both together.
          APPA_VERSION: v0.38.1
          APPA_SHA256: 9f96f7501c8a9445f53dd17bdf5da1adaf5f7d256f310c11c60273206509df39
        run: |
          archive="$RUNNER_TEMP/appa-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' -o "$archive" \
            "https://github.com/archestra-ai/OpenAPPA/releases/download/$APPA_VERSION/appa-x86_64-unknown-linux-gnu.tar.gz"
          echo "$APPA_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" ./appa
          "$HOME/.local/bin/appa" --version
      - name: Replay policy decisions
        if: hashFiles('traces/*.appa') != ''
        run: |
          "$HOME/.local/bin/appa" replay --config appa.toml traces/
